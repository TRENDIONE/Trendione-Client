<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Compound Intelligence{% endblock %}</title>
<style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#182230;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}.top{background:#152536;color:#fff;padding:18px 28px}.top a{color:#fff;text-decoration:none;margin-right:22px;font-weight:600}.wrap{max-width:1120px;margin:30px auto;padding:0 22px}.muted{color:#667085}.panel{background:white;border:1px solid #e3e8ee;border-radius:12px;padding:22px;margin:16px 0;box-shadow:0 2px 8px #10203008}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.stat strong{display:block;font-size:28px;margin-top:8px}input,textarea,select{width:100%;padding:11px;border:1px solid #cbd5df;border-radius:7px;font:inherit;margin:6px 0 14px}button,.btn{background:#1769aa;color:white;border:0;border-radius:7px;padding:11px 16px;font:inherit;font-weight:650;text-decoration:none;display:inline-block;cursor:pointer}.btn.secondary{background:#e9eef3;color:#233547}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row input{flex:1;min-width:220px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #edf0f3}.table th{color:#667085;font-size:13px}.tag{display:inline-block;background:#eef3f7;border-radius:20px;padding:4px 9px;font-size:12px}.message{padding:12px;border-radius:8px;background:#eef6ff;margin:12px 0}.errorlist{color:#b42318}a{color:#1769aa}.field{margin:12px 0}.field label{font-weight:650}.field ul{padding-left:20px}h1{margin-top:0}code{overflow-wrap:anywhere}@media(max-width:650px){.top{padding:16px}.top a{display:inline-block;margin:5px 12px 5px 0}.table{font-size:13px}}
</style></head><body><header class="top"><a href="/">Compound Intelligence</a><a href="/compounds/">Compounds</a><a href="/compounds/new/">Add compound</a><a href="/import/pubchem/">Import from PubChem</a></header><main class="wrap">{% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
